<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ProPresenter 원격 제어 웹앱" />
    <title>ProPresenter Remote</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-labelledby="title">
        <span class="eyebrow">PROPRESENTER REMOTE</span>
        <h1 id="title">연결 설정</h1>
        <p class="intro">조작할 ProPresenter가 설치된 PC의 네트워크 정보를 입력하세요.</p>

        <form id="connection-form" novalidate>
          <div class="field">
            <label for="host">PC IP 주소</label>
            <input
              id="host"
              name="host"
              type="text"
              inputmode="decimal"
              placeholder="예: 192.168.0.10"
              autocomplete="off"
              required
            />
            <span class="hint">같은 네트워크에 있는 ProPresenter PC의 IPv4 주소</span>
          </div>

          <div class="field">
            <label for="port">포트 번호</label>
            <input
              id="port"
              name="port"
              type="number"
              inputmode="numeric"
              placeholder="예: 1025"
              value="1025"
              min="1"
              max="65535"
              required
            />
          </div>

          <p id="form-error" class="form-error" role="alert" hidden></p>
          <button type="submit">ProPresenter 연결</button>
        </form>

        <p id="form-status" class="form-status" role="status" hidden></p>
      </section>
    </main>
    <main class="control-app" id="control-view" hidden>
      <aside class="sidebar">
        <div class="sidebar-header"><div><span class="eyebrow">PROPRESENTER REMOTE</span><h2>재생목록</h2></div><button class="icon-button" id="settings-button" type="button" aria-label="연결 설정">⚙</button></div>
        <div class="connection-pill"><span class="status-dot" aria-hidden="true"></span><span id="connection-label"></span></div>
        <nav id="playlist-list" class="playlist-list" aria-label="재생목록 목록"></nav>
      </aside>
      <section class="workspace" aria-labelledby="workspace-title">
        <header class="workspace-header"><div><span class="eyebrow">PLAYLIST</span><h1 id="workspace-title"></h1></div><span class="live-badge">연결됨</span></header>
        <p id="api-error" class="form-error" role="alert" hidden></p>
        <div id="slide-grid" class="slide-grid"></div>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
